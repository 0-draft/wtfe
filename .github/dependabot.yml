version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      test:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "@axe-core/*"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # @astrojs/check still declares a typescript <7 peer range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
